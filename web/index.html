<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0d0d0d" />
    <!-- The Appearance choice (src/appearance.ts) BEFORE the first paint, so
         a light page never flashes dark while the app loads. -->
    <script>
      (function () {
        var t = 'system';
        try {
          t = localStorage.getItem('soundshaper.theme') || 'system';
        } catch (e) {}
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta name="description" content="EQ, speed and clips for MP3s" />
    <title>Sound Shaper</title>
    <!-- The link card a shared URL unfolds into (LinkedIn, Messages, X…):
         the app icon on juanevillam.com's ground, 1200 × 627. It is the
         portfolio's LinkedIn thumbnail (docs/profile/linkedin-thumbnails,
         ?mark=shaper), copied here; re-render it there when the icon moves. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sound Shaper" />
    <meta property="og:title" content="Sound Shaper" />
    <meta
      property="og:description"
      content="A music player for your own MP3s: change the speed, shape the sound, loop your favorite part."
    />
    <meta property="og:url" content="https://soundshaper.juanevillam.com/" />
    <meta
      property="og:image"
      content="https://soundshaper.juanevillam.com/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:alt" content="The Sound Shaper app icon" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
