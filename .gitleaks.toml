# Secret scanning for this repo — run by the pre-commit hook on staged changes
# and usable on the whole history with `gitleaks git --log-opts="--all" .`.
#
# Extends gitleaks' default rules. The allowlist below names values that are
# PUBLIC BY DESIGN and would otherwise fail every commit that touches them:
#
# - Firebase client config (`google-services.json`, `GoogleService-Info.plist`):
#   the `AIza…` keys ship inside every app binary; Firestore rules are the
#   boundary, and the keys are restricted per bundle/package in Google Cloud.
# - `firebase-tools`' installed-app OAuth client secret, used by the admin
#   scripts in `scripts/` to exchange the LOCAL refresh token (read from
#   ~/.config, never committed). It is published in firebase-tools' own source.
# - Lockfile checksums, which trip the generic-api-key entropy rule.
#
# Anything else it flags is a real finding: remove it from the commit, rotate
# it, and never add it here to make a commit pass.

[extend]
useDefault = true

[[allowlists]]
description = "Public-by-design Firebase client config and lockfile hashes"
paths = [
  '''(^|/)google-services\.json$''',
  '''(^|/)GoogleService-Info\.plist$''',
  '''(^|/)Podfile\.lock$''',
  '''(^|/)Manifest\.lock$''',
  '''(^|/)package-lock\.json$''',
]

[[allowlists]]
description = "firebase-tools' public installed-app OAuth client secret"
regexTarget = "match"
regexes = ['''CLIENT_SECRET\s*=\s*["']j9iVZfS8kkCEFUPaAeJV0sAi["']''']
