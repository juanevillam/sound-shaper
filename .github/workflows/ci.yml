name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      # Note: expo-router typed routes (.expo/types) are generated by `expo start`
      # and don't exist in CI, so Href checking is looser here than locally.
      - run: npm run typecheck
      - run: npm run test:unit
      # The Worker is its own package with its own lockfile.
      - run: npm ci && npm run typecheck
        working-directory: media-worker
      # Advisory full report (never fails the build)…
      - run: npm audit --omit=dev
        continue-on-error: true
      # BLOCKING at critical. Every high left is transitive build tooling with
      # no fixed release to move to (node-forge, braces, image-size, and the
      # xmldom 0.7 line under @bacons/xcode) — see docs/release.md gate 3.
      - run: npm audit --omit=dev --audit-level=critical

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the pushed commits against .gitleaks.toml. A personal account
      # needs no GITLEAKS_LICENSE; only organisation-owned repos do.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
