name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      # Note: expo-router typed routes (.expo/types) are generated by `expo start`
      # and don't exist in CI, so Href checking is looser here than locally.
      - run: npm run typecheck
      # Firestore security-rules regression suite (emulator; Java 21 above).
      - run: npm run test:rules -w apps/topper
      # Advisory full report (never fails the build)…
      - run: npm audit --omit=dev
        continue-on-error: true
      # …but high/critical advisories in runtime deps DO fail the build.
      - run: npm audit --omit=dev --audit-level=high
