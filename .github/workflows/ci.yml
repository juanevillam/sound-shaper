name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Note: expo-router typed routes (.expo/types) are generated by `expo start`
      # and don't exist in CI, so Href checking is looser here than locally.
      - run: npm run typecheck
      - run: npm run test:unit
      # Advisory full report (never fails the build)…
      - run: npm audit --omit=dev
        continue-on-error: true
      # High/critical advisories in runtime deps. ADVISORY FOR NOW: every one
      # today is transitive through Expo, React Native or Firebase, and a fix
      # moves versions the patches/ pins and the SDK-drift workaround depend
      # on. Clearing them is a quality-audit item in docs/release.md; make this
      # step blocking again once it passes.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
